# Clinical Compass — описание API и страниц (этап 12, черновик для этапа 13).
# Копируется в репозиторий как docs/openapi.yaml; меняется вместе с кодом.
openapi: 3.1.0
info:
  title: Clinical Compass API
  version: 0.1.0-draft
  description: 'Описание API и страниц Clinical Compass (этап 12). Одно API для веб-оболочки v5, будущего бота и мобильного приложения.


    Соглашения:

    - Базовый путь JSON — /api/v1; страницы (SSR, EJS) — без префикса, тег pages.

    - Вход: cookie cc_sid (HttpOnly, Secure, SameSite=Lax). Изменяющие запросы с cookie несут заголовок X-CSRF-Token. Токен Bearer (bearerToken)
    — точка подключения бота и приложения, в MVP не выдаётся.

    - Запись: заголовок Idempotency-Key (UUID, F-18); повтор с тем же ключом 24 ч возвращает первый ответ; тот же ключ с другим телом — E-IDEMPOTENCY-MISMATCH.

    - Ошибки: тело Error, поле code — код каталога 08/09, key — ключ текста err.*. Соответствие кода и HTTP-статуса — в x-error-codes каждого
    ответа. Информационные коды (E-GROUP-TOO-SMALL, E-NO-CLINICIAN, E-PARSE-INCOMPLETE, E-OCR-FAILED, E-PSEUDO-UNKNOWN-KEY) приходят в ответе
    2xx в warnings[] (x-warnings).

    - E-ACCESS (403) — роли действие не разрешено; чужой, незакреплённый или несуществующий объект — 404 E-NOT-FOUND (не раскрываем существование),
    в журнал доступа пишется deny.

    - Права: x-roles (роль R- и объём: С своё, З закреплённые и замещаемые, В без данных пациентов, Ч чтение, А агрегаты, Д демо, КО/ИП/ПС отметки),
    x-permission (строка права в src/access), x-patient-access (цель проверки F-11).

    - «Отменить»: x-undo=true — ответ содержит undo {id, expires_at}; отмена — POST /api/v1/undo/{undo_id}.

    - x-crisis-gate=true — свободный текст проходит кризисную проверку кодом до любой другой обработки; при срабатывании ответ содержит crisis
    (CrisisCard).

    - Время — ISO 8601 UTC; ID — целые; списки — page (с 1), по 50.

    - Режим обслуживания: E-MAINTENANCE (503) на всех не-админских адресах, кроме 112, справки и входа.

    - Тесты находят элементы по data-testid = ключ текста из locales/ru.json (см. build-rules.md).'
servers:
- url: http://localhost:3300
  description: локальная разработка
- url: https://demo.example.invalid
  description: демо-VPS (домен владелец даст позже)
tags:
- name: service
- name: auth
- name: consents
- name: common
- name: composer
- name: crisis
- name: ai
- name: tests
- name: diary
- name: meds
- name: ae
- name: signals
- name: messages
- name: visits
- name: library
- name: privacy
- name: patients
- name: documents
- name: analytics
- name: demo
- name: admin-chat
- name: admin-queue
- name: admin-people
- name: admin-settings
- name: admin-ai
- name: admin-service
- name: admin-content
- name: admin-analytics
- name: pages
paths:
  /api/v1/me/analytics:
    get:
      operationId: get_me_analytics
      summary: Факты и сводки собственных данных пациента
      description: 'Повторные события с происхождением, отдельными единицами и версиями. Баллы тестов заменяются фактом завершения. Пропуски неизвестны, не равны нулю.'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-02 пациент: С — только своё']
      x-permission: diary.write
      x-idempotency-key: not_used
      x-patient-access: self
      security: [{cookieSession: []}]
      parameters:
      - {name: from, in: query, schema: {type: string, format: date}}
      - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: 'period, scope, formula_version, rows с определениями/числителями/знаменателями/пропусками, events без patient_id'}
        '401': {description: E-SESSION-EXPIRED}
        '403': {description: E-ACCESS}
        '422': {description: 'E-VALIDATION — неверная дата, порядок дат или период больше 731 включённого дня'}
  /api/v1/analytics/patients/{patient_id}:
    get:
      operationId: get_analytics_patient
      summary: Доступные факты закреплённого пациента
      description: 'Только действующее закрепление и обязательное согласие; текущая видимость оценок, заметок, лекарств, привычек. Психологу не передаются лекарства и НЯ. Чтение журналируется.'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-03 психиатр: З — закреплённые', 'R-04 психолог: З — закреплённые']
      x-permission: patient.view
      x-idempotency-key: not_used
      x-patient-access: diary
      security: [{cookieSession: []}]
      parameters:
      - {name: patient_id, in: path, required: true, schema: {type: integer}}
      - {name: from, in: query, schema: {type: string, format: date}}
      - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: 'period, scope, formula_version, rows, events с происхождением без patient_id'}
        '401': {description: E-SESSION-EXPIRED}
        '403': {description: E-ACCESS}
        '404': {description: E-NOT-FOUND — чужой/откреплённый пациент или отозванное согласие}
        '422': {description: E-VALIDATION — период максимум 731 включённый день}
  /api/v1/analytics/reports:
    get:
      operationId: get_analytics_reports
      summary: Текущая или историческая когорта врача, агрегаты программы
      description: 'current и historical только специалисту; program только администратору. Исторические события пересекаются с датами закрепления и эпизода; текущие согласия и видимость применяются немедленно. DISTINCT пациенты, подавление малых групп для каждой метрики. Произвольные привычки исключены без общего определения и разрешения на агрегирование. Только read-only views, идентификаторы и индивидуальные события не возвращаются.'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-03 психиатр: А — только агрегаты', 'R-04 психолог: А — только агрегаты', 'R-05 администратор: А — только агрегаты программы']
      x-permission: analytics.own
      x-idempotency-key: not_used
      security: [{cookieSession: []}]
      parameters:
      - {name: scope, in: query, schema: {type: string, enum: [current, historical, program]}}
      - {name: from, in: query, schema: {type: string, format: date}}
      - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: 'scope, period, n_people, members_suppressed, min_group, rows (n_people, n_events, numerator, denominator, mean, missing_numeric, missing_people, formula_version, suppressed), cohort_policy'}
        '401': {description: E-SESSION-EXPIRED}
        '403': {description: E-ACCESS — роль или область недоступна}
        '422': {description: E-VALIDATION — неверная область/дата или период больше 731 включённого дня}
  /api/v1/admin/analytics/users:
    get:
      operationId: get_admin_analytics_users
      summary: Люди по ролям и продуктовая активность без клинических данных
      description: 'Текущие нетомстоун-аккаунты считаются по users, включая демо, блокированные и деактивированные. История активности и роли начинается с history_started_at, не восстанавливается из старых сессий. Уникальные люди, события и сессии — разные счётчики. Общий итог дедуплицирует сменивших роль; малые группы и дополняющие итоги подавлены.'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-05 администратор: А — только агрегаты']
      x-permission: admin.metrics
      x-idempotency-key: not_used
      security: [{cookieSession: []}]
      parameters:
      - {name: from, in: query, schema: {type: string, format: date}}
      - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: 'scope=product_users, history_started_at, history_policy, current_policy, formula_version, active_people, total_suppressed, rows по patient/psychiatrist/psychologist (current_people, active_people, n_events, n_sessions и suppressed)'}
        '401': {description: E-SESSION-EXPIRED}
        '403': {description: E-ACCESS}
        '422': {description: E-VALIDATION — период максимум 731 включённый день}

  /api/v1/admin/dashboard:
    get:
      operationId: get_admin_dashboard
      summary: Обзор администратора рассказом — главы с выводами, плитками и графиками
      description: 'Главы: люди, диагноз-врачи-лекарства-результат (по выбранному диагнозу, расчёт как у admin/insights), активность, самочувствие, тесты, лечение, побочные эффекты, забота и безопасность, ИИ, материалы и цветок, сервис и доступ. Данные пациентов — только участники программы (базовое согласие и согласие на программу) из представлений без идентификаторов через соединение «только чтение»; ячейки с числом людей меньше analytics.min_group (не меньше 10) приходят как null. Служебные цифры (аккаунты, очередь, ИИ, журналы входа и доступа) агрегируются без идентификаторов пациентов. Определения и пороги предварительные (review-required).'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-05 администратор: А — только агрегаты']
      x-permission: admin.metrics
      x-idempotency-key: not_used
      security: [{cookieSession: []}]
      parameters:
      - {name: days, in: query, schema: {type: integer, enum: [30, 90, 180, 365]}, description: 'Длина периода в днях, по умолчанию 90; сравнение идёт с предыдущим таким же периодом'}
      - {name: dx, in: query, schema: {type: string}, description: 'Диагноз для главы «Для программы»: all, unknown или код из diagnosis_catalog'}
      responses:
        '200': {description: 'scope=program, period, previous, min_group, lead, kpis[] (value, prev, delta, hint), chapters[] (key, title, headline, blocks[] типов tiles, series, bars, stack, funnel, note), disclaimer'}
        '401': {description: E-SESSION-EXPIRED}
        '403': {description: E-ACCESS}
        '422': {description: E-VALIDATION — недопустимая длина периода}
  /api/v1/admin/insights:
    get:
      operationId: get_admin_insights
      summary: Аналитика рассказом по диагнозу для заказчика (программа поддержки)
      description: 'Разделы: кто они, кто их ведёт, чем живут врачи, что назначают, что реально происходит, что получается, какова цена. Только участники с базовым согласием и согласием на программу; read-only представления insights_* без идентификаторов. Малые группы (analytics.min_group, не меньше 10) и ячейки специалистов (меньше 3) скрыты, итоги подавлены с дополнением. Место работы, журналы и конференции — только специалистов, разрешивших профиль. Все определения и пороги предварительные (review-required).'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-05 администратор: А — только агрегаты']
      x-permission: admin.metrics
      x-idempotency-key: not_used
      security: [{cookieSession: []}]
      parameters:
      - {name: dx, in: query, schema: {type: string}, description: 'all, unknown или код из diagnosis_catalog'}
      - {name: from, in: query, schema: {type: string, format: date}}
      - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: 'scope=program, preliminary, formula_version, diagnosis{selected, options}, n_patients, summary[], disclaimer, sections[] (key, title, headline, status, how и данные раздела; скрытые значения null)'}
        '401': {description: E-SESSION-EXPIRED}
        '403': {description: E-ACCESS}
        '422': {description: E-VALIDATION — неизвестный диагноз или период больше 730 дней}
  /api/v1/admin/insights/export:
    get:
      operationId: get_admin_insights_export
      summary: CSV с агрегатами аналитики по диагнозу
      description: 'То же, что admin/insights, только показанные значения; скрытые ячейки пусты. Запись в export_log (kind program, recipient_class sponsor_aggregate).'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-05 администратор: А — только агрегаты']
      x-permission: admin.metrics
      x-idempotency-key: not_used
      security: [{cookieSession: []}]
      parameters:
      - {name: dx, in: query, schema: {type: string}}
      - {name: from, in: query, schema: {type: string, format: date}}
      - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: 'text/csv; charset=utf-8 с BOM, разделитель «;», как у GET /api/v1/analytics/export (section=insights)'}
        '403': {description: E-ACCESS}
        '422': {description: E-VALIDATION}
  /api/v1/analytics/export:
    get:
      operationId: get_analytics_export
      summary: Выгрузка аналитики вкладки «Аналитика» в CSV (специалист, администратор)
      description: 'Те же цифры, что роль видит на вкладке «Аналитика», без идентификаторов пациентов и специалистов: читаются представления без идентификаторов через соединение «только чтение». Специалист (R-03, R-04) получает своих пациентов, администратор — участников программы (согласие program). section=diary — дневник когорты (как analytics/my-patients и admin/metrics?by=diary), section=insights — отчёт по диагнозу (как analytics/my-insights и admin/insights), без section — оба. Группы меньше analytics.min_group (не меньше 10) скрыты так же, как на экране: ячейка пуста, в примечании «скрыто». Период и диагноз берутся из запроса, как на вкладке. Формат: UTF-8 с BOM, разделитель «;», десятичная запятая, CRLF; ячейки, начинающиеся с = + - @ табуляции или возврата каретки, экранируются апострофом. Имя файла clinical-compass-analytics-ГГГГ-ММ-ДД.csv (Content-Disposition: attachment). Выгрузка пишется в action_log (analytics.export: раздел, период, число строк — без содержимого); у администратора ещё и в export_log (kind program).'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-03 психиатр: А — только агрегаты', 'R-04 психолог: А — только агрегаты', 'R-05 администратор: А — только агрегаты']
      x-permission: analytics.export
      x-idempotency-key: not_used
      security: [{cookieSession: []}]
      parameters:
      - {name: section, in: query, schema: {type: string, enum: [diary, insights, all]}, description: 'по умолчанию all'}
      - {name: dx, in: query, schema: {type: string}, description: 'all, unknown или код из diagnosis_catalog (только для section=insights|all)'}
      - {name: from, in: query, schema: {type: string, format: date}}
      - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: 'text/csv; charset=utf-8 с BOM; колонки: Раздел; Показатель; Значение; Единица; Число людей; Примечание'}
        '401': {description: E-SESSION-EXPIRED}
        '403': {description: E-ACCESS — роль без права (пациент, чужая роль)}
        '422': {description: E-VALIDATION — неверный section, dx или период больше 730 дней}
  /api/v1/analytics/my-insights:
    get:
      operationId: get_analytics_my_insights
      summary: Аналитика по своим пациентам с рассказом-выводом
      description: 'Только пациенты с текущим закреплением и базовым согласием; видимость дневника и журнала приёма применяется сразу. Ничего о других специалистах. Психолог не получает назначения, приём и побочные эффекты; психиатр — только побочные эффекты, адресованные ему и уже показанные. Порог малой группы не применяется (специалист и так видит пациентов), при менее 10 пациентах разделы помечены «мало наблюдений». patients[] — пациенты со ссылкой на карточку.'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-03 психиатр: З', 'R-04 психолог: З (без лекарств и побочных)']
      x-permission: analytics.own
      x-idempotency-key: not_used
      security: [{cookieSession: []}]
      parameters:
      - {name: dx, in: query, schema: {type: string}}
      - {name: from, in: query, schema: {type: string, format: date}}
      - {name: to, in: query, schema: {type: string, format: date}}
      responses:
        '200': {description: 'scope=own, sections[], summary[], patients[] (id, name, dx, drugs, adherence, bought, ae_reports, tests, mood)'}
        '403': {description: E-ACCESS}
        '422': {description: E-VALIDATION}
  /api/v1/me/clinician-profile:
    get:
      operationId: get_me_clinician_profile
      summary: Профессиональный профиль специалиста (необязательный)
      description: 'Специальность, место работы, журналы и конференции. Не требуется для работы.'
      tags: [analytics]
      x-functions: [F-71]
      x-roles: ['R-03 психиатр: С', 'R-04 психолог: С']
      x-permission: analytics.own
      x-idempotency-key: not_used
      security: [{cookieSession: []}]
      responses:
        '200': {description: 'specialty, organization, analytics_consent, journals, conferences, options'}
        '403': {description: E-ACCESS}
    put:
      operationId: put_me_clinician_profile
      summary: Сохранить профиль специалиста
      description: 'analytics_consent=true разрешает использовать место работы, журналы и конференции в обезличенной статистике (группы не меньше 3 специалистов); false — немедленный отзыв. Нужен Idempotency-Key.'
      tags: [analytics]
      x-functions: [F-71]
      x-roles: ['R-03 психиатр: С', 'R-04 психолог: С']
      x-permission: analytics.own
      x-idempotency-key: required
      security: [{cookieSession: []}]
      responses:
        '200': {description: профиль}
        '403': {description: E-ACCESS}
        '422': {description: E-VALIDATION}
  /api/v1/patients/{patient_id}/diagnosis:
    get:
      operationId: get_patient_diagnosis
      summary: Диагноз пациента, указанный врачом (необязательно)
      description: 'Справочник diagnosis_catalog (МКБ-10, предварительный). Чужой или откреплённый пациент — 404.'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-03 психиатр: З', 'R-04 психолог: З']
      x-permission: patient.view
      x-idempotency-key: not_used
      x-patient-access: diagnosis
      security: [{cookieSession: []}]
      parameters:
      - {name: patient_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: 'current{code,label,set_at}|null, options'}
        '404': {description: E-NOT-FOUND}
    put:
      operationId: put_patient_diagnosis
      summary: Указать или снять диагноз пациента
      description: 'Только психиатр (diagnosis.record). Прежний диагноз закрывается, история сохраняется. Нужен Idempotency-Key; обращение в журнале доступа к данным пациента.'
      tags: [analytics]
      x-functions: [F-71, F-74]
      x-roles: ['R-03 психиатр: З']
      x-permission: diagnosis.record
      x-idempotency-key: required
      x-patient-access: diagnosis
      security: [{cookieSession: []}]
      parameters:
      - {name: patient_id, in: path, required: true, schema: {type: integer}}
      responses:
        '200': {description: 'current, options'}
        '403': {description: E-ACCESS — психолог}
        '404': {description: E-NOT-FOUND}
        '422': {description: E-VALIDATION — код вне справочника}

  /api/v1/admin/staff:
    post:
      operationId: adminCreateStaff
      summary: Создать сотрудника (F-89)
      tags: [Admin]
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name, email, role]
              properties:
                full_name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                role: { type: string, enum: [psychiatrist, psychologist, admin] }
      responses:
        '201':
          description: Сотрудник создан, временный пароль и запись undo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  temporary_password: { type: string }
                  undo: { type: object, properties: { id: { type: string } } }
        '409': { description: E-EMAIL-TAKEN }
        '422': { description: E-VALIDATION }
  /healthz:
    get:
