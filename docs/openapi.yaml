          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: E-VALIDATION
          x-error-codes:
          - E-VALIDATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
