components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: cc_sid
      description: сессия в таблице sessions (sha256 ID)
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: токен из GET /api/v1/csrf или <meta name="csrf-token">
    bearerToken:
      type: http
      scheme: bearer
      description: 'ПОЗЖЕ: токены бота и приложения (таблица api_tokens — открытый вопрос этапа 12); те же права, что у пользователя-владельца
        токена; CSRF не нужен'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 'F-18: ключ создаётся при открытии формы или композера'
  schemas:
    DrugKnowledgeSearch:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              document_id: {type: string}
              label: {type: string}
              section_id: {type: string}
              path: {type: string}
              page: {type: integer, nullable: true}
              snippet: {type: string}
              score: {type: number}
              match_type: {type: string, enum: [hybrid, lexical]}
              inn:
                type: object
                description: только в общем поиске; id — каталожный id приложения или null, если МНН нет в каталоге
                properties:
                  id: {type: integer, nullable: true}
                  name: {type: string}
        total: {type: integer}
        hasMore: {type: boolean}
        fallback: {type: string, nullable: true, enum: [lexical, unavailable]}
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: код из каталога 08/09, например E-ACCESS
            key:
              type: string
