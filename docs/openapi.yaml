        в одной транзакции учётная запись и записи consent_events (версия и хэш текста, который открывается по ссылке /legal/consent/{kind};
        base фиксирует и принятие соглашения, вид agreement). Без invite_code создаётся пациент без врача, код можно ввести позже
        (POST /me/care-link). Занятая почта вместе с кодом возвращает тот же E-INVITE-INVALID (без раскрытия), без кода — E-EMAIL-TAKEN.
