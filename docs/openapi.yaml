      - F-45
      - F-65
      x-roles:
      - 'R-03 психиатр: З — закреплённый пациент'
      - 'R-04 психолог: З — закреплённый пациент; плана и чужих записей не видит'
      x-permission: ae.report_clinician
      x-patient-access: ae_intake
      x-idempotency-key: required
      x-undo: false
      x-crisis-gate: false
      description: |
        Психиатр: text, severity, decision (probable|unrelated|insufficient), serious, comment?, med (plan_item+item_key | other); запись сразу с итоговым статусом related_likely|not_related|insufficient. Психолог: text, severity, started_on?, med.name (текст); запись awaiting_doctor для психиатра пациента; без психиатра — 409 E-NO-PSYCHIATRIST. thread_id — свой тред clinician_chat по этому пациенту (сводка пишется в тред).
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - name: patient_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - text
              - severity
              properties:
                text:
                  type: string
                  maxLength: 1000
                started_on:
                  type: string
                  format: date
                symptoms:
                  type: array
                  items:
                    type: string
                    pattern: "^[a-z][a-z0-9_]{0,31}$"
                    description: код подсказки (nausea, dizzy); другие строки отбрасываются, не массив - E-VALIDATION
                  maxItems: 10
                severity:
                  type: string
                  enum:
                  - mild
                  - noticeable
                  - severe
                source:
                  type: string
                  enum:
                  - form
                  - ai_chat
                thread_id:
                  type: integer
                med:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - plan_item
                      - other
                    item_key:
                      type: string
                    patient_med_id:
                      type: integer
                    inn_id:
                      type: integer
                    name:
                      type: string
                      maxLength: 200
                decision:
                  type: string
                  enum:
                  - probable
                  - unrelated
                  - insufficient
                  description: только психиатр, обязательно
                serious:
                  type: boolean
                  description: только психиатр
                comment:
                  type: string
                  maxLength: 1000
                  description: только психиатр
      security:
      - cookieSession: []
        csrfHeader: []
      - bearerToken: []
      responses:
        '201':
          description: успех
          content:
            application/json:
              schema:
                type: object
                properties:
                  ae:
                    $ref: '#/components/schemas/AdverseEvent'
                  notice_available:
                    type: boolean
                    description: true — психиатр, decision probable; доступен GET /adverse-events/{ae_id}/notice
                  summary:
                    $ref: '#/components/schemas/AESummary'
        '401':
          description: E-SESSION-EXPIRED
          x-error-codes:
          - E-SESSION-EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: E-CSRF, E-ACCESS, E-CONSENT-REQUIRED
          x-error-codes:
          - E-CSRF
          - E-ACCESS
          - E-CONSENT-REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: E-NOT-FOUND (чужой пациент или чужой тред)
          x-error-codes:
          - E-NOT-FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: E-NO-PSYCHIATRIST (психолог, у пациента нет психиатра), E-STATUS (идёт стирание данных), E-IDEMPOTENCY-MISMATCH
          x-error-codes:
