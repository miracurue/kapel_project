    post:
      operationId: post_me_adverse_events
      summary: Сообщить о побочном эффекте (диалог → карточка → «Отправить врачу»)
      tags:
      - ae
      x-functions:
      - F-45
      - F-16
      x-roles:
      - 'R-02 пациент: С — только своё'
      x-permission: ae.report
      x-patient-access: self
      x-idempotency-key: required
      x-undo: true
      x-crisis-gate: true
      description: нет описания (symptoms и text пусты) — E-VALIDATION; видимость врачу через 10 с (F-17)
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                symptoms:
                  type: array
                  items:
                    type: string
                    pattern: "^[a-z][a-z0-9_]{0,31}$"
                    description: код подсказки (nausea, dizzy); другие строки отбрасываются, не массив - E-VALIDATION
                  maxItems: 10
                text:
                  type: string
                  maxLength: 1000
                started_on:
                  type: string
                  format: date
                severity:
                  type: string
                  enum:
                  - mild
                  - noticeable
                  - severe
                related:
                  type: string
                  enum:
                  - 'yes'
                  - 'no'
                  - unknown
                med_ref:
                  $ref: '#/components/schemas/ChipRef'
                upload_ids:
                  type: array
                  items:
                    type: integer
                  maxItems: 5
                  description: ID временных загрузок из POST /api/v1/uploads (F-15)
                from_suggestion:
                  type: string
                item_key:
                  type: string
                  description: ключ элемента плана лечения, к которому относится НЯ
                patient_med_id:
                  type: integer
                  description: ID своего препарата, к которому относится НЯ
                submit:
                  type: boolean
                  description: false — сохранить как черновик (draft), не отправляя врачу; отсутствие или true — обычная отправка
                draft_id:
                  type: integer
                  description: ID своего черновика для редактирования, финальной отправки или отмены; черновик чужого пациента запрещён
                discard:
                  type: boolean
                  description: true вместе с draft_id — мягко отменить свой черновик
                source:
                  type: string
                  enum:
                  - form
                  - ai_chat
                  description: откуда запись; ai_chat — из карточки-опроса в чате (по умолчанию form)
                thread_id:
                  type: integer
                  description: свой тред patient_assistant, из которого пришла запись; чужой — 404 E-NOT-FOUND. При отправке сервер пишет в тред сводку (kind ae_summary)
                med:
                  type: object
                  description: препарат из опроса. kind none («ничего не принимаю») запись не создаёт, ответ 200 {not_adverse:true}
                  required:
                  - kind
                  properties:
                    kind:
                      type: string
                      enum:
                      - plan_item
                      - other
                      - none
                    item_key:
                      type: string
                      description: для plan_item — действующий пункт плана
                    patient_med_id:
                      type: integer
                    inn_id:
                      type: integer
                    name:
                      type: string
                      maxLength: 200
                      description: свободное название препарата (если не из плана), хранится в med_text_enc
      security:
      - cookieSession: []
        csrfHeader: []
      - bearerToken: []
      responses:
        '200':
          description: med.kind=none — запись не создана; либо кризисная карточка без сохранения
          content:
            application/json:
              schema:
                type: object
                properties:
                  not_adverse:
                    type: boolean
                  saved:
                    type: boolean
                  crisis:
                    $ref: '#/components/schemas/CrisisCard'
        '201':
          description: успех. Нет психиатра (в том числе только психолог) — ae.attached=false, status saved_private; запись личная, службе и врачам не уходит
          content:
            application/json:
              schema:
                type: object
                properties:
                  ae:
                    $ref: '#/components/schemas/AdverseEvent'
                  summary:
                    $ref: '#/components/schemas/AESummary'
                  undo:
                    $ref: '#/components/schemas/Undo'
                  crisis:
                    $ref: '#/components/schemas/CrisisCard'
        '401':
          description: E-SESSION-EXPIRED
          x-error-codes:
          - E-SESSION-EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: E-CSRF, E-CONSENT-REQUIRED, E-ACCESS
          x-error-codes:
          - E-CSRF
          - E-CONSENT-REQUIRED
          - E-ACCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: E-NOT-FOUND (чужой тред или черновик)
          x-error-codes:
          - E-NOT-FOUND
          content:
