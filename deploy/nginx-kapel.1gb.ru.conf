# /etc/nginx/sites-enabled/kapel.1gb.ru — отдельный файл, чужие server-блоки не трогаем.
# Порядок: 1) положить этот файл как есть (только :80), nginx -t, reload;
# 2) certbot --nginx -d kapel.1gb.ru (правит только этот блок и добавляет 443 и редирект);
# 3) проверить, что в блоке 443 остались auth_basic и location /api/v1/stt.
# Пароль демо: sudo htpasswd -c /etc/nginx/.htpasswd-kapel <пользователь>   (apache2-utils)
server {
    listen 80;
    listen [::]:80;
    server_name kapel.1gb.ru;

    auth_basic "Clinical Compass demo";
    auth_basic_user_file /etc/nginx/.htpasswd-kapel;

    client_max_body_size 10m;

    # Голос: аудио до 60 МБ (лимит ml-worker), расшифровка идёт по одному файлу за раз.
    location = /api/v1/stt {
        client_max_body_size 64m;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_request_buffering on;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/cc-proxy.conf;
    }

    location / {
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:8001;
        include /etc/nginx/snippets/cc-proxy.conf;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
}
